<section id="setup-screen"
         class="container d-flex flex-column justify-content-center align-items-center text-center py-5">

    <h1 class="display-4 fw-bold mb-3">
        {{ game_title }}
    </h1>

    <p class="lead text-light-emphasis mb-4">
        {{ game_description }}
    </p>

    <div class="setup-box bg-dark border-secondary shadow-lg p-4">

        <div class="d-flex flex-wrap justify-content-center gap-2">

            <button id="load-lesson-btn"
                    type="button"
                    class="btn btn-outline-light game-button">
                <i class="bi bi-folder2-open"></i>
                Load Lesson Pack
            </button>

            <a id="new-lesson-btn"
               href="{{ url_for('review_questions', game_name=game_name) }}"
               class="btn btn-outline-light game-button">
                <i class="bi bi-plus-circle"></i>
                Create Lesson Pack
            </a>

        </div>

        <input type="file"
               id="lesson-file"
               accept=".zip"
               hidden>

        <div id="lesson-info" class="mt-4" hidden>

            <h2 class="h5">Lesson Loaded</h2>

            <p class="mb-1">
                <strong>Grade:</strong>
                <span id="lesson-grade">-</span>
            </p>

            <p class="mb-1">
                <strong>Lesson:</strong>
                <span id="lesson-name">-</span>
            </p>

            <p class="mb-0">
                <strong>Questions:</strong>
                <span id="lesson-question-count">0</span>
            </p>

        </div>

        <div class="mt-4">

            <label for="team-count" class="form-label">
                Number of Teams
            </label>

            <input type="number"
                   id="team-count"
                   class="form-control mx-auto text-center"
                   min="2"
                   max="6"
                   value="2"
                   style="max-width: 120px">

        </div>

        <button id="start-game-btn"
                type="button"
                class="btn btn-outline-light game-button mt-4">
            Start Game
        </button>

    </div>
</section>
