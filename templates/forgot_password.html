{% extends "base.html" %}

{% block title %}
    Forgot Password | Teachers Online
{% endblock %}

{% block styles %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section class="login-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <div class="login-panel">
                    <header class="text-center mb-4">
                        <div class="login-avatar mb-3" aria-hidden="true">
                            <i class="bi bi-envelope-arrow-up"></i>
                        </div>
                        <p class="login-kicker mb-2">ACCOUNT RECOVERY</p>
                        <h1 class="h2 mb-2">Forgot your password?</h1>
                        <p class="text-secondary mb-0">
                            Enter your account email and we’ll send a secure reset link.
                        </p>
                    </header>

                    <form method="post" action="{{ url_for('forgot_password') }}">
                        <div class="mb-4">
                            <label for="email" class="form-label">Email address</label>
                            <input class="form-control"
                                   type="email"
                                   id="email"
                                   name="email"
                                   maxlength="254"
                                   autocomplete="email"
                                   required>
                        </div>
                        <button class="btn btn-brand w-100" type="submit">
                            Send reset link
                            <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i>
                        </button>
                    </form>

                    <p class="login-signup text-center text-secondary mt-4 mb-0">
                        <a href="{{ url_for('login') }}">Back to login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
